name: CI

# What a stranger should be able to check without taking anybody's word for it:
# that the tests pass, that the determinism lint holds, and that the simulator
# finds nothing signed and plenty unsigned.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests and lints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Determinism lint
        working-directory: backend
        # This one runs first and on its own. If simulated code has started
        # reaching past the ambient environment, every result below it is
        # about a different program than the one the seeds describe.
        run: python3 scripts/audit_determinism.py

      - name: Documentation claims match the committed results
        working-directory: backend
        # Prose does not fail a build, which is how almost every README ends up
        # lying slightly: a number is right when it is written and wrong three
        # commits later. This checks the measured claims against the artefacts
        # that produced them. It found drift on its first run.
        run: python3 scripts/audit_claims.py

      - name: STATISTICS.md matches the repository
        working-directory: backend
        run: python3 scripts/statistics.py --check

      - name: Tests
        working-directory: backend
        run: python3 -m pytest -q

  simulation:
    name: deterministic simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Signed sweep — expect no counterexample
        working-directory: backend
        run: python3 scripts/simulate.py --seeds 200 --out /tmp/signed.json

      - name: Unsigned control — expect the attack to land
        working-directory: backend
        # The control is the point. A signed sweep finding nothing means
        # nothing on its own: it is only evidence beside a run where the same
        # simulator, on the same seeds, finds the attack. So this step fails
        # the build if the control comes back *clean*, which would mean the
        # simulator had stopped mounting the attack rather than that the
        # attack had stopped working.
        run: |
          python3 scripts/simulate.py --seeds 200 --unsigned --no-shrink \
                  --stop-after 200 --out /tmp/unsigned.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/unsigned.json"))
          failures = len(data["failures"])
          print(f"unsigned control: {failures} of {data['executions']} executions falsified")
          if failures < 50:
              sys.exit("the control found almost nothing — the simulator is no longer "
                       "mounting the attack, so the signed sweep above proves nothing")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation
          path: /tmp/*.json

  bakeoff:
    name: qdrant engine vs local index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: The two query paths must still compute the same pipeline
        working-directory: backend
        # Latency is a machine's business and this runner is not the target, so
        # nothing here asserts which path is faster. What it asserts is that
        # they still agree: if Qdrant's dense recall, its sparse recall, or its
        # fusion ever stops matching ours, the router would be choosing between
        # two different answers rather than two speeds — and the whole reason
        # the engine is allowed to serve queries is that it does not.
        run: |
          python3 scripts/qdrant_bakeoff.py --points 400 --queries 24 \
                  --json /tmp/bakeoff.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/bakeoff.json"))
          print(f"dense {d['dense_overlap']}, sparse {d['sparse_overlap']}, "
                f"same-constant {d['same_constant_overlap']}, "
                f"pre-filter {d['pre_filter_overlap']}, refusals {d['refusals']}")
          if not d["same_pipeline"]:
              sys.exit("the engine and the local index no longer compute the same "
                       "pipeline: " + d["verdict"])
          if d["dense_recall_at_k"]["engine"] < 0.99:
              sys.exit("the engine's dense recall fell below exact brute force")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bakeoff
          path: /tmp/bakeoff.json
