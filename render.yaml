# Render — runs the AegisEdge node.
#
# The console is a static page and goes to Netlify (see netlify.toml). The node
# is the half that needs a real host: it holds an embedded Qdrant on disk,
# compiles two ONNX graphs at first boot, fsyncs a write-ahead log, serves a
# WebSocket, and runs background sync, gossip and invariant loops. That needs a
# long-lived process with a persistent disk, which is what this describes.
#
# Deploy: Render → New → Blueprint → point it at this repository.

services:
  - type: web
    name: aegisedge-node
    runtime: python
    # Free. No card, no disk — see the trade-offs below and in DEPLOY.md.
    # Upgrade to `starter` and add the `disk:` block back to keep memories
    # across restarts; everything else about this file stays the same.
    plan: free
    region: oregon
    branch: main

    # One instance, always. Embedded Qdrant takes an exclusive lock on its
    # directory and the write-ahead log has a single writer, so a second
    # instance on the same disk would be refused at boot — correctly, but the
    # deploy would look broken. Scale by running more *nodes* with their own
    # disks and letting them find each other over the mesh, which is what the
    # sync engine is for.
    numInstances: 1

    # The ONNX graphs are compiled from the bundled weights here, at build
    # time, rather than on first boot. It takes about a second and the result
    # is part of the deployed slug, so a cold start does not pay for it — which
    # matters on the free tier, where the service sleeps and every wake would
    # otherwise recompile them.
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd backend &&
      python -c "from pathlib import Path; from aegis.inference.onnx_runtime import provision; provision(Path('models'))"
    startCommand: cd backend && uvicorn aegis.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/v1/health

    # No disk. A persistent disk needs a paid instance, so on the free tier the
    # filesystem is ephemeral: the node works completely, and its memories,
    # write-ahead log and Qdrant collections are gone when the service restarts
    # or wakes from sleep. That is a real limitation, not a hidden one — the
    # console will simply show an empty node and you ingest again.

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Memories, the write-ahead log, immutable segments and the embedded
      # Qdrant. Ephemeral on the free tier; point this at a mounted disk the
      # moment there is one.
      - key: AEGIS_DATA_DIR
        value: /opt/render/project/src/backend/.aegis

      # Where the build command put the compiled graphs.
      - key: AEGIS_MODEL_DIR
        value: /opt/render/project/src/backend/models

      - key: AEGIS_NODE_ID
        value: edge-render-01

      # Qdrant is a hard requirement; a node that silently fell back to the
      # internal store would be telling its operator something untrue about
      # where their data lives. Left at the default (required) on purpose.
      - key: AEGIS_REQUIRE_QDRANT
        value: "1"

      # The console is served from another origin, so the node has to allow it.
      #
      # A real value rather than a prompt, deliberately. Left blank at Blueprint
      # time this would be the empty string, not unset — and the node splits it
      # on commas into `allow_origins = [""]`, which admits no origin at all.
      # The console would be CORS-blocked and the node would look broken while
      # being perfectly healthy.
      #
      # Narrow it to the Netlify site's exact URL in the Render dashboard once
      # the site has its final name. "*" is right for a demo and wrong for
      # anything holding real data.
      - key: AEGIS_CORS_ORIGINS
        value: "*"

      # Set this and issue keys, and every route requires one. Leave it off for
      # a judge-facing demo; turn it on for anything with real data in it.
      - key: AEGIS_REQUIRE_AUTH
        sync: false

      # Point this at a Qdrant Server to move the query path onto a compiled
      # engine — the router will then always choose it, because one call beats
      # four. Empty means the embedded instance on the disk above.
      - key: AEGIS_QDRANT_URL
        sync: false
      - key: AEGIS_QDRANT_API_KEY
        sync: false
